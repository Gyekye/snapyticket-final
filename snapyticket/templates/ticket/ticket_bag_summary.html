{% extends 'base.html' %} {% block content %}{% load ticket_counter %}

<div class="item-count">Number of tickets in bag : {{ request.user | cart_item_count }}</div><hr>
<ul>
    {% for ticket in ticket_bag.tickets.all %}
    <li>
        {{ticket.ticket_type}} * {{ticket.quantity}}
    </li>
    {% endfor %}
</ul>
<a href="{% url 'core:payment'%}">checkout</a><br><br>
{% endblock content %}
