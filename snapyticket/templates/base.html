{% load static %}
<!-- EvesBay Landing Page -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EvesBay</title>
    <!-- Favicon -->
    <link rel="icon" href="{% static 'imgs/icons/evesbay.ico' %}">
    <!-- End of Favicon -->

    <!-- CSS -->

    <!-- Materialize css cdn link -->
    <link rel="stylesheet" href="{% static 'css/materialize.min.css' %}">
    <!-- End of materialize css cdn link -->

    <!-- Owl carousel css cdn link -->
    <link rel="stylesheet" href="{% static 'css/owl.carousel.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/owl.theme.default.min.css' %}">
    <!-- End of Owl carousel css cdn link -->

    <!-- Custom css link -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <!-- End of custom css link -->

    <!-- END OF CSS -->

    <!-- FONTS -->

    <!-- Material Icons -->
    <link rel="stylesheet" href="{% static 'fonts/icon.css' %}">
    <!-- End of material icons -->

    <!-- Default Fonts -->
    <link rel="stylesheet" href="{% static 'fonts/default.css' %}">
    <!-- End of default Fonts -->

    <!-- Fontawesome fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <!-- End of Fontawesome fonts -->

    <!-- END OF FONTS -->

</head>

<body>

    <section class="hide-on-large-only">
        {% block mobilecontent %} {% endblock mobilecontent %}
    </section>



    <!-- End of Main Section -->

    <!-- JS -->

    <!-- Jquery js cdn link -->
    <script src="{% static 'js/context.js' %}"></script>
    <!-- End of jquery js cdn link -->

    <!-- Owl carousel js cdn link -->
    <script src="{% static 'js/owl.carousel.min.js' %}"></script>
    <!-- End of Owl carousel js cdn link -->

    <!-- Materialize js cdn link -->
    <script src="{% static 'js/materialize.min.js' %}"></script>
    <!-- End of materialize js cdn link -->

    <!-- Custom js link -->
    <script src="{% static 'js/main.js' %}"></script>
    <!-- End of custom js link -->

    <!--END OF JS  -->
</body>

</html>
