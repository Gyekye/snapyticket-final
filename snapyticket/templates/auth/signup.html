{% extends 'base-auth.html' %} {% block content %} {% load static %}

<section class="login-form-container">
    <img src="{% static 'imgs/svgs/getstarted.svg' %}" class="login-svg" alt="">
    <div class="login-form-banner">
        <div class="login-form-banner-content">
            <a href="" class="btn waves-effect waves-light left btn-floating grey darken-3 btnX z-depth-0 backBtn"><i class="material-icons">arrow_back</i></a>
            <div class="center-align section-x">
                <div class="heading-banner white-text">
                    Get a free Account Today
                </div>
                <p class="heading-banner-helper-text grey-text text-lighten-4">
                    Get your tickets at the ease of your home
                </p>
            </div>
        </div>
    </div>
    <div class="login-form-box valign-wrapper">
        <div class="form-box">
            <div class="form-box-content">
                <a href="" class="right">
                    <img src="{% static 'imgs/core/logo.png' %}" class="form-img" alt="">
                </a>
                <div class="heading-form">Get Started</div>
                <p class="heading-form-helper-text">Get a free account today</p>
                <div class="cotext-x">
                    <a href="" class="btn white form-btn grey-text text-darken-3 bold-text"><img src="{% static 'imgs/icons/google.png' %}" class="left google-icon" alt=""> Continue with Google</a>
                </div>
                <div class="cotext-xs">
                    <form method="POST">
                        {% csrf_token %} {{ form.as_p }}
                        <br>
                        <a href="{% url 'auth:user_login' %}" class="waves-effect waves-blue bold-text mt-x" id="loginForm">Login to my account</a>
                        <button type="submit" class="right btn btnX form-btn-submit z-depth-0" id="submitForm">Create Account</button>
                        <a href="" class="waves-effect waves-blue bold-text mt-x" id="backForm">Back</a>
                        <a type="submit" class="right btn form-btn-submit z-depth-0" id="nextForm">Next</a>
                        <br>
                    </form>
                    <br>
                </div>
            </div>
        </div>
    </div>
</section>

{% endblock content %}
